<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Round Navigator v2 Demo</title>
    <style>
      :root {
        --canvas: #eef2f5;
        --sheet: #f8faf9;
        --surface: rgba(255, 255, 255, 0.78);
        --surface-strong: rgba(255, 255, 255, 0.94);
        --surface-muted: rgba(239, 243, 242, 0.86);
        --border: rgba(120, 133, 148, 0.2);
        --border-strong: rgba(91, 108, 128, 0.3);
        --text: #303844;
        --muted: #758091;
        --faint: #a7b0bc;
        --blue: #5d84b8;
        --blue-soft: rgba(93, 132, 184, 0.14);
        --green: #5f8f81;
        --amber: #b7894b;
        --red: #b9646f;
        --shadow: 0 20px 50px rgba(55, 72, 94, 0.13);
        --soft-shadow: 0 10px 28px rgba(55, 72, 94, 0.09);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(circle at 16% -10%, rgba(183, 201, 218, 0.45), transparent 34rem),
          radial-gradient(circle at 86% 18%, rgba(197, 213, 201, 0.38), transparent 30rem),
          linear-gradient(180deg, #f5f7f8, var(--canvas));
        color: var(--text);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        letter-spacing: 0;
      }

      button {
        font: inherit;
      }

      .app {
        display: grid;
        grid-template-columns: 258px minmax(0, 1fr) 56px;
        height: 100vh;
      }

      .sidebar {
        min-width: 0;
        border-right: 1px solid rgba(127, 142, 161, 0.14);
        background: rgba(244, 248, 250, 0.72);
        backdrop-filter: blur(20px);
        padding: 18px 14px;
      }

      .sidebar-title {
        margin: 4px 10px 18px;
        font-size: 18px;
        font-weight: 720;
      }

      .search {
        display: flex;
        align-items: center;
        height: 38px;
        gap: 8px;
        margin: 0 2px 20px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.62);
        color: var(--faint);
        padding: 0 12px;
        font-size: 13px;
      }

      .nav-section {
        margin: 22px 0 10px;
        padding: 0 10px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .project {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 42px;
        border-radius: 12px;
        padding: 0 10px;
        color: #596678;
        font-size: 14px;
        font-weight: 620;
      }

      .project.active {
        border: 1px solid rgba(93, 132, 184, 0.28);
        background: rgba(93, 132, 184, 0.08);
        color: #3e536f;
      }

      .project-mark {
        display: grid;
        width: 22px;
        height: 22px;
        place-items: center;
        border-radius: 7px;
        background: linear-gradient(135deg, #6d8cc8, #7ab394);
        color: white;
        font-size: 10px;
        font-weight: 750;
      }

      .stage {
        position: relative;
        min-width: 0;
        overflow: hidden;
      }

      .topbar {
        position: absolute;
        inset: 0 0 auto 0;
        z-index: 20;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        height: 56px;
        padding: 0 28px;
        pointer-events: none;
      }

      .session-title {
        justify-self: center;
        font-size: 14px;
        font-weight: 720;
        color: #252b34;
      }

      .mode-switch {
        justify-self: end;
        display: flex;
        gap: 4px;
        border: 1px solid rgba(127, 142, 161, 0.18);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.72);
        padding: 4px;
        pointer-events: auto;
        box-shadow: 0 8px 22px rgba(45, 58, 76, 0.08);
      }

      .mode-switch button {
        height: 28px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        padding: 0 12px;
        font-size: 12px;
        font-weight: 680;
      }

      .mode-switch button.active {
        background: #283445;
        color: white;
      }

      .timeline {
        position: absolute;
        inset: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        scroll-behavior: smooth;
        padding: 96px 230px 150px 112px;
      }

      .timeline::-webkit-scrollbar {
        width: 0;
      }

      .round {
        position: relative;
        max-width: 820px;
        min-height: 320px;
        margin: 0 auto 32px;
        scroll-margin-top: 88px;
      }

      .round.short {
        min-height: 230px;
      }

      .user-bubble {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 38px;
      }

      .user-bubble > div {
        max-width: 360px;
        border: 1px solid rgba(93, 132, 184, 0.24);
        border-radius: 18px;
        background: rgba(219, 233, 251, 0.75);
        box-shadow: 0 8px 20px rgba(61, 104, 156, 0.12);
        padding: 12px 15px;
        color: #30415c;
        font-size: 14px;
        font-weight: 650;
      }

      .assistant {
        position: relative;
        width: min(820px, 100%);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.78);
        box-shadow: var(--soft-shadow);
        padding: 22px 24px;
      }

      .assistant::before {
        content: "";
        position: absolute;
        left: -22px;
        top: 24px;
        bottom: 24px;
        width: 2px;
        border-radius: 2px;
        background: rgba(109, 125, 145, 0.22);
      }

      .assistant-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
      }

      .state-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--green);
      }

      .state-dot.running {
        background: var(--blue);
        box-shadow: 0 0 0 4px rgba(93, 132, 184, 0.12);
      }

      .state-dot.failed {
        background: var(--red);
      }

      .state-dot.question {
        background: var(--amber);
      }

      .assistant p {
        margin: 0 0 12px;
        color: #414b59;
        font-size: 15px;
        line-height: 1.72;
      }

      .assistant p:last-child {
        margin-bottom: 0;
      }

      .code-chip {
        border: 1px solid rgba(111, 126, 143, 0.18);
        border-radius: 5px;
        background: rgba(239, 242, 241, 0.84);
        padding: 1px 5px;
        color: #4d657f;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.88em;
      }

      .composer {
        position: absolute;
        left: max(112px, 50% - 520px);
        right: max(240px, 50% - 520px);
        bottom: 18px;
        z-index: 30;
        border: 1px solid rgba(127, 142, 161, 0.2);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: var(--shadow);
        backdrop-filter: blur(22px);
        padding: 14px;
      }

      .composer-placeholder {
        color: #8b95a4;
        font-size: 14px;
        font-weight: 560;
      }

      .composer-tools {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 20px;
      }

      .pill {
        height: 28px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(245, 248, 250, 0.72);
        color: #6c7686;
        padding: 0 12px;
        font-size: 12px;
        font-weight: 650;
      }

      .send {
        margin-left: auto;
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: #d9e0e8;
        color: white;
      }

      .right-tabs {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        border-left: 1px solid rgba(127, 142, 161, 0.14);
        background: rgba(244, 248, 250, 0.68);
        padding-top: 54px;
      }

      .tab-icon {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border: 1px solid transparent;
        border-radius: 12px;
        color: #8590a0;
        font-size: 15px;
      }

      .tab-icon.active {
        border-color: rgba(93, 132, 184, 0.28);
        background: rgba(93, 132, 184, 0.1);
        color: #4f74a6;
      }

      .navigator-shell {
        position: absolute;
        top: 74px;
        right: 24px;
        bottom: 112px;
        z-index: 25;
        width: 240px;
        pointer-events: none;
      }

      .navigator {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 34px;
        pointer-events: auto;
        transition: width 180ms ease;
      }

      .wheel-panel {
        position: absolute;
        top: 50%;
        right: 0;
        width: 28px;
        height: min(460px, calc(100vh - 250px));
        transform: translateY(-50%);
        overflow: hidden;
        border: 1px solid transparent;
        border-radius: 18px;
        background: transparent;
        box-shadow: none;
        backdrop-filter: none;
        opacity: 1;
        transition:
          width 180ms ease,
          border-color 180ms ease,
          background-color 180ms ease,
          box-shadow 180ms ease,
          opacity 180ms ease,
          transform 180ms ease;
      }

      .navigator:hover,
      .navigator.pinned {
        width: 232px;
      }

      .navigator:hover .wheel-panel,
      .navigator.pinned .wheel-panel {
        width: 176px;
        border-color: rgba(126, 140, 157, 0.22);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.76);
        box-shadow: var(--shadow);
        backdrop-filter: blur(24px);
      }

      .wheel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 40px;
        border-bottom: 1px solid rgba(126, 140, 157, 0.14);
        padding: 0 14px;
      }

      .navigator:not(:hover):not(.pinned) .wheel-header {
        opacity: 0;
        pointer-events: none;
      }

      .wheel-title {
        color: #475364;
        font-size: 11px;
        font-weight: 760;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .navigator:not(:hover):not(.pinned) .wheel-title {
        display: none;
      }

      .counter {
        color: #7d8795;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        font-weight: 720;
        white-space: nowrap;
      }

      .wheel-list {
        position: absolute;
        top: 40px;
        right: 0;
        bottom: 38px;
        left: 0;
        overflow: hidden;
        padding: 10px 8px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 120ms ease 40ms;
      }

      .navigator:hover .wheel-list,
      .navigator.pinned .wheel-list {
        opacity: 1;
        pointer-events: auto;
      }

      .wheel-fade-top,
      .wheel-fade-bottom {
        position: absolute;
        right: 0;
        left: 0;
        z-index: 3;
        height: 70px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 120ms ease 40ms;
      }

      .navigator:hover .wheel-fade-top,
      .navigator:hover .wheel-fade-bottom,
      .navigator.pinned .wheel-fade-top,
      .navigator.pinned .wheel-fade-bottom {
        opacity: 1;
      }

      .wheel-fade-top {
        top: 40px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0));
      }

      .wheel-fade-bottom {
        bottom: 38px;
        background: linear-gradient(0deg, rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0));
      }

      .anchor-row {
        position: absolute;
        left: 8px;
        right: 8px;
        display: grid;
        grid-template-columns: 22px minmax(0, 1fr);
        align-items: center;
        gap: 7px;
        border: 1px solid transparent;
        border-radius: 12px;
        background: transparent;
        color: #5a6574;
        cursor: pointer;
        padding: 0 9px;
        text-align: left;
        transform-origin: 50% 50%;
        transition:
          background-color 120ms ease,
          border-color 120ms ease,
          box-shadow 120ms ease;
      }

      .anchor-row:hover {
        border-color: rgba(93, 132, 184, 0.28);
        background: rgba(93, 132, 184, 0.08);
      }

      .anchor-row.active {
        border-color: rgba(28, 34, 42, 0.12);
        background: rgba(30, 36, 44, 0.07);
        box-shadow: none;
      }

      .anchor-index {
        color: #9aa3af;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        font-weight: 760;
      }

      .anchor-preview {
        min-width: 0;
      }

      .anchor-text {
        overflow: hidden;
        color: #424b58;
        font-size: 12px;
        font-weight: 680;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .mode-dots .anchor-row {
        left: 0;
        right: 0;
        grid-template-columns: 1fr;
        justify-items: center;
        gap: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        padding: 0;
      }

      .mode-dots .anchor-index,
      .mode-dots .anchor-preview {
        display: none;
      }

      .dense-dots {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        display: block;
        overflow: hidden;
        padding: 0;
        opacity: 1;
        transition: opacity 120ms ease;
      }

      .navigator:hover .dense-dots,
      .navigator.pinned .dense-dots {
        opacity: 0;
        pointer-events: none;
      }

      .dot-button {
        position: absolute;
        left: 50%;
        display: block;
        width: 3px;
        height: 3px;
        border: 0;
        border-radius: 50%;
        background: rgba(86, 93, 104, 0.2);
        cursor: pointer;
        transform: translate(-50%, -50%);
        transition:
          width 120ms ease,
          height 120ms ease,
          background-color 120ms ease,
          opacity 120ms ease;
      }

      .dot-button:hover {
        width: 5px;
        height: 5px;
        background: rgba(31, 36, 44, 0.42);
      }

      .dot-button.active {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: rgba(24, 28, 34, 0.92);
        box-shadow: 0 0 0 5px rgba(24, 28, 34, 0.045);
      }

      .wheel-footer {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 38px;
        border-top: 1px solid rgba(126, 140, 157, 0.14);
        padding: 0 14px;
      }

      .navigator:not(:hover):not(.pinned) .wheel-footer {
        opacity: 0;
        pointer-events: none;
      }

      .wheel-hint {
        color: #8b95a4;
        font-size: 10px;
        font-weight: 640;
      }

      .navigator:not(:hover):not(.pinned) .wheel-hint {
        display: none;
      }

      .mini-button {
        display: grid;
        width: 22px;
        height: 22px;
        place-items: center;
        border: 1px solid rgba(126, 140, 157, 0.18);
        border-radius: 8px;
        background: rgba(246, 248, 249, 0.8);
        color: #7d8795;
        cursor: pointer;
      }

      .toast {
        position: absolute;
        top: 62px;
        left: 50%;
        z-index: 50;
        border: 1px solid rgba(126, 140, 157, 0.2);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 12px 26px rgba(45, 58, 76, 0.1);
        color: #5d6877;
        padding: 8px 13px;
        font-size: 12px;
        font-weight: 680;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -10px);
        transition:
          opacity 180ms ease,
          transform 180ms ease;
      }

      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      @media (max-width: 1180px) {
        .app {
          grid-template-columns: 0 minmax(0, 1fr) 46px;
        }

        .sidebar {
          display: none;
        }

        .timeline {
          padding-left: 48px;
          padding-right: 174px;
        }

        .navigator-shell {
          right: 18px;
          width: 190px;
        }

        .navigator,
        .wheel-panel {
          width: 190px;
        }

        .composer {
          left: 48px;
          right: 160px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-title">xuanpu</div>
        <div class="search">⌕ 筛选项目...</div>
        <div class="nav-section">项目</div>
        <div class="project"><span class="project-mark">GB</span> gbrain</div>
        <div class="project"><span class="project-mark">YO</span> YowantHub</div>
        <div class="project active"><span class="project-mark">XU</span> xuanpu</div>
        <div class="project"><span class="project-mark">TC</span> task_bpm</div>
        <div class="nav-section">工作树</div>
        <div class="project active"><span class="project-mark">fx</span> fix/Session...</div>
        <div class="project"><span class="project-mark">rl</span> release/v1...</div>
        <div class="project"><span class="project-mark">ui</span> feat/ui-pol...</div>
      </aside>

      <main class="stage">
        <div class="topbar">
          <div></div>
          <div class="session-title">Session 1</div>
          <div class="mode-switch" aria-label="navigator mode">
            <button class="active" data-action="auto" type="button">Hover</button>
            <button data-action="pin" type="button">Pin</button>
          </div>
        </div>

        <div class="toast" id="toast">跳转到第 27 轮</div>

        <div class="timeline" id="timeline"></div>

        <div class="navigator-shell">
          <div class="navigator mode-wheel" id="navigator">
            <div class="wheel-panel">
              <div class="wheel-header">
                <div class="wheel-title">Rounds</div>
                <div class="counter" id="counter">27 / 64</div>
              </div>
              <div class="wheel-fade-top"></div>
              <div class="wheel-list" id="wheelList"></div>
              <div class="dense-dots" id="denseDots"></div>
              <div class="wheel-fade-bottom"></div>
              <div class="wheel-footer">
                <div class="wheel-hint" id="hint">滚轮浏览，点击跳转</div>
                <button class="mini-button" id="recenter" type="button" title="回到当前轮">⌖</button>
              </div>
            </div>
          </div>
        </div>

        <div class="composer">
          <div class="composer-placeholder">输入消息...</div>
          <div class="composer-tools">
            <button class="pill" type="button">附件</button>
            <button class="pill" type="button">记忆</button>
            <button class="pill" type="button">计划</button>
            <button class="send" type="button">↑</button>
          </div>
        </div>
      </main>

      <aside class="right-tabs">
        <div class="tab-icon active">▥</div>
        <div class="tab-icon">⌁</div>
        <div class="tab-icon">▣</div>
        <div class="tab-icon">◎</div>
      </aside>
    </div>

        'mimo 实施清单',
        'CR 实施结果',
        '收尾验证'
      ]

      const stateCycle = [
        'normal',
        'normal',
        'changed',
        'normal',
        'question',
        'normal',
        'normal',
        'changed',
        'normal',
        'failed',
        'normal',
        'running'
      ]

      const rounds = Array.from({ length: 64 }, (_, i) => {
        const title = roundTopics[i % roundTopics.length]
        const state = i === 26 ? 'running' : stateCycle[i % stateCycle.length]
        const minutes = 11 * 60 + 23 + i * 7
        const hh = String(Math.floor(minutes / 60) % 24).padStart(2, '0')
        const mm = String(minutes % 60).padStart(2, '0')
        return {
          id: `round-${i + 1}`,
          index: i + 1,
          title,
          state,
          time: `${hh}:${mm}`
        }
      })

      const timeline = document.getElementById('timeline')
      const wheelList = document.getElementById('wheelList')
      const denseDots = document.getElementById('denseDots')
      const navigator = document.getElementById('navigator')
      const counter = document.getElementById('counter')
      const toast = document.getElementById('toast')
      const recenter = document.getElementById('recenter')
      const modeButtons = Array.from(document.querySelectorAll('[data-action]'))

      let activeIndex = 26
      let railFocusIndex = 26
      let toastTimer = null

      function previewText(value) {
        const compact = String(value || '').replace(/\s+/g, ' ').trim()
        if (!compact) return '未命名'
        return compact.length > 10 ? `${compact.slice(0, 10)}…` : compact
      }

      function renderTimeline() {
        timeline.innerHTML = rounds
          .map((round, i) => {
            const short = i % 3 === 1 ? ' short' : ''
            const secondParagraph =
              round.state === 'failed'
                ? '这一轮包含失败工具调用，所以在右侧导航里只用一个克制的红色状态点提示，不把整行染红。'
                : round.state === 'question'
                  ? '这一轮需要用户确认，导航里用琥珀色状态点提示，方便长会话里快速回看阻塞点。'
                  : '正文滚动仍然由主 timeline 控制，右侧导航只调用现有 round anchor 跳转，不直接接管 scrollTop。'

            return `
              <section class="round${short}" id="${round.id}" data-round-index="${i}">
                <div class="user-bubble"><div>${round.title}</div></div>
                <article class="assistant">
                  <div class="assistant-meta">
                    <span class="state-dot ${round.state}"></span>
                    <span>Agent</span>
                    <span>第 ${round.index} 轮</span>
                    <span>${round.time}</span>
                  </div>
                  <p>这是第 ${round.index} 轮的回复示例。右侧导航展示当前附近的轮次，中心行清晰，上下轮次逐渐缩小和淡出。</p>
                  <p>${secondParagraph}</p>
                  <p>如果内容里出现 <span class="code-chip">docs/plans/session-hq</span> 或 <span class="code-chip">scrollToRound()</span>，正文仍保持阅读优先。</p>
                </article>
              </section>
            `
          })
          .join('')
      }

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max)
      }

      function visibleWheelRounds() {
        const slotCount = 10
        const centerSlot = 4
        let start = railFocusIndex - centerSlot
        start = clamp(start, 0, Math.max(0, rounds.length - slotCount))
        return {
          start,
          centerSlot: railFocusIndex - start,
          items: rounds.slice(start, start + slotCount)
        }
      }

      function renderWheel() {
        counter.textContent = `${activeIndex + 1} / ${rounds.length}`
        const { start, centerSlot, items } = visibleWheelRounds()
        const panelHeight = wheelList.clientHeight || 440
        const centerY = panelHeight / 2

        wheelList.innerHTML = items
          .map((round, localIndex) => {
            const actualIndex = start + localIndex
            const distance = localIndex - centerSlot
            const absDistance = Math.abs(distance)
            const weight = 1 - Math.min(absDistance / 5, 1)
            const height = Math.round(24 + weight * 12)
            const scale = 0.92 + weight * 0.08
            const opacity = 0.22 + weight * 0.78
            const y = centerY + distance * 34 - height / 2
            const isActive = actualIndex === activeIndex
            const isFocused = actualIndex === railFocusIndex
            const title = previewText(round.title)
            return `
              <button
                class="anchor-row ${isActive ? 'active' : ''} ${isFocused ? 'focused' : ''}"
                style="top:${y}px;height:${height}px;opacity:${opacity};transform:scale(${scale});"
                data-index="${actualIndex}"
                type="button"
                aria-current="${isActive ? 'step' : 'false'}"
                title="第 ${round.index} 轮：${round.title}"
              >
                <span class="anchor-index">${String(round.index).padStart(2, '0')}</span>
                <span class="anchor-preview">
                  <span class="anchor-text">${title}</span>
                </span>
              </button>
            `
          })
          .join('')

        Array.from(wheelList.querySelectorAll('[data-index]')).forEach((button) => {
          button.addEventListener('click', () => jumpToRound(Number(button.dataset.index)))
        })
      }

      function renderDots() {
        const markerIndexes = []
        for (let offset = -3; offset <= 3; offset++) {
          const index = clamp(activeIndex + offset, 0, rounds.length - 1)
          if (!markerIndexes.includes(index)) markerIndexes.push(index)
        }

        denseDots.innerHTML = markerIndexes
          .map((i, slot) => {
            const round = rounds[i]
            const top =
              markerIndexes.length === 1 ? 50 : 30 + (slot / (markerIndexes.length - 1)) * 40
            const distance = Math.abs(i - activeIndex)
            const opacity = i === activeIndex ? 1 : 0.18 + (1 - Math.min(distance / 3, 1)) * 0.36
            return `
              <button
                class="dot-button ${i === activeIndex ? 'active' : ''}"
                style="top:${top}%;opacity:${opacity};"
                data-index="${i}"
                type="button"
                title="第 ${round.index} 轮：${round.title}"
              ></button>
            `
          })
          .join('')

        Array.from(denseDots.querySelectorAll('[data-index]')).forEach((button) => {
          button.addEventListener('click', () => jumpToRound(Number(button.dataset.index)))
        })
      }

      function renderNavigator() {
        navigator.classList.remove('mode-dots')
        navigator.classList.add('mode-wheel')
        renderWheel()
        renderDots()
      }

      function showToast(index) {
        clearTimeout(toastTimer)
        toast.textContent = `跳转到第 ${index + 1} 轮`
        toast.classList.add('show')
        toastTimer = setTimeout(() => toast.classList.remove('show'), 900)
      }

      function jumpToRound(index) {
        const nextIndex = clamp(index, 0, rounds.length - 1)
        activeIndex = nextIndex
        railFocusIndex = nextIndex
        const element = document.getElementById(rounds[nextIndex].id)
        if (element) element.scrollIntoView({ behavior: 'smooth', block: 'start' })
        renderNavigator()
        showToast(nextIndex)
      }

      function updateActiveFromScroll() {
        const sections = Array.from(document.querySelectorAll('.round'))
        let bestIndex = activeIndex
        let bestDistance = Number.POSITIVE_INFINITY
        for (const section of sections) {
          const rect = section.getBoundingClientRect()
          const distance = Math.abs(rect.top - 92)
          if (distance < bestDistance) {
            bestDistance = distance
            bestIndex = Number(section.dataset.roundIndex)
          }
        }
        if (bestIndex !== activeIndex) {
          activeIndex = bestIndex
          railFocusIndex = bestIndex
          renderNavigator()
        }
      }

      wheelList.addEventListener(
        'wheel',
        (event) => {
          event.preventDefault()
          const delta = event.deltaY > 0 ? 1 : -1
          railFocusIndex = clamp(railFocusIndex + delta, 0, rounds.length - 1)
          renderNavigator()
        },
        { passive: false }
      )

      denseDots.addEventListener(
        'wheel',
        (event) => {
          event.preventDefault()
          const delta = event.deltaY > 0 ? 3 : -3
          railFocusIndex = clamp(activeIndex + delta, 0, rounds.length - 1)
          jumpToRound(railFocusIndex)
        },
        { passive: false }
      )

      modeButtons.forEach((button) => {
        button.addEventListener('click', () => {
          const action = button.dataset.action
          if (action === 'pin') {
            navigator.classList.add('pinned')
          } else {
            navigator.classList.remove('pinned')
          }
          modeButtons.forEach((item) => item.classList.toggle('active', item === button))
          railFocusIndex = activeIndex
          renderNavigator()
        })
      })

      recenter.addEventListener('click', () => {
        railFocusIndex = activeIndex
        renderNavigator()
      })

      timeline.addEventListener('scroll', () => {
        window.requestAnimationFrame(updateActiveFromScroll)
      })

      renderTimeline()
      renderNavigator()
      window.setTimeout(() => jumpToRound(activeIndex), 120)
      window.addEventListener('resize', renderNavigator)
    </script>
  </body>
</html>
